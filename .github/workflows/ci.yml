name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - uses: actions/checkout@v7
        with:
          repository: openai/codex
          ref: 4ef836f883c38ba6d39e6920f335ce6452b7de33
          path: .official-codex-validators
          sparse-checkout: |
            codex-rs/skills/src/assets/samples/plugin-creator
            codex-rs/skills/src/assets/samples/skill-creator
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate all three plugin manifests and Skills against pinned official tools
        shell: bash
        run: |
          python3 .official-codex-validators/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py plugins/context-relay
          python3 .official-codex-validators/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py plugins/execution-budget
          python3 .official-codex-validators/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py plugins/async-wait-guard
          python3 .official-codex-validators/codex-rs/skills/src/assets/samples/skill-creator/scripts/quick_validate.py plugins/context-relay/skills/project-handoff
          python3 .official-codex-validators/codex-rs/skills/src/assets/samples/skill-creator/scripts/quick_validate.py plugins/execution-budget/skills/execution-budget
          python3 .official-codex-validators/codex-rs/skills/src/assets/samples/skill-creator/scripts/quick_validate.py plugins/async-wait-guard/skills/async-wait-guard
